[package]
name = "installer"
version = "1.1.0"
edition = "2024"
build = "build.rs"
default-run = "SRXDManager"

[package.metadata.winresource]
ProductName = "SRXDManager"
FileDescription = "SRXD Mod Manager"
ProductVersion = "1.1.0"
Comments = "Created by bacur.xyz"

[[bin]]
name = "SRXDManager"
path = "src/main.rs"

[dependencies]
colored = "3.1.1"
configparser = "3.1.0"
eframe = { version = "0.36.1", default-features = false, features = [
  "glow",
  "links",
  "persistence"
] }
flume = "0.12.0"
model = { path = "../model" }
open = "5.3.5"
parking_lot = "0.12.5"
rust-i18n = "4.1.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
steamlocate = "2.0.1"
sys-locale = "0.3.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio = { version = "1.52.3", default-features = false, features = [
  "fs",
  "rt-multi-thread"
] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
  "glow",
  "links",
  "persistence",
  "wayland",
  "x11"
] }
regashii = "0.4.0"
reqwest = { version = "0.13.1", default-features = false, features = [
  "http2",
  "rustls"
] }

[target.'cfg(target_os = "windows")'.dependencies]
reqwest = { version = "0.13.1", default-features = false, features = [
  "http2",
  "native-tls"
] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[lints.cargo]
non_kebab_case_bins = "allow"
